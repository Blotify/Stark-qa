[project]
name = "stark-qa"
version = "0.1.0"
description = "STARK-QA: hybrid RAG + KAG question answering over the FairytaleQA dataset"
readme = "README.md"
requires-python = ">=3.11,<3.13"

# Mirrors requirements.txt. The code degrades gracefully if a heavy dependency is
# missing, but this pins the full stack so STARK-QA runs with real dense
# retrieval, spaCy NER, the full evaluation metrics and the Mistral LLM.
dependencies = [
    # --- Core scientific stack ---
    "numpy>=1.24.0,<2.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",

    # --- Dense retrieval (RAG) ---
    "torch>=2.0.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",

    # --- NLP / knowledge-graph baseline ---
    # After install, fetch the model: `uv run python -m spacy download en_core_web_sm`
    "spacy>=3.7.0",
    "networkx>=3.2.0",
    "nltk>=3.8.1",

    # --- Dataset loading (a cached split is shipped in cache/) ---
    "datasets>=2.10.0",

    # --- Mistral LLM answer generation (set MISTRAL_API_KEY) ---
    "mistralai>=1.0.0",
    "python-dotenv>=1.0.0",

    # --- Evaluation metrics ---
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "textstat>=0.7.3",
]

[tool.uv]
# Flat application layout (run via `python main.py`), not an installable library,
# so don't try to build/install this project itself.
package = false

# Keep the CPU-only torch build (smaller download, no CUDA) on Linux/Windows.
# macOS already resolves to CPU wheels from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]
